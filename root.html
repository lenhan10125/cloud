<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="access.js" data-require-token="true"></script>
  <title>Hướng dẫn nhanh | ORICIIN</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, Arial, sans-serif;
      color: #18252b;
      background: #f2f5f5;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 40px 20px; }
    main { width: min(760px, 100%); margin: 0 auto; }
    h1 { margin: 0 0 8px; font-size: clamp(1.7rem, 5vw, 2.2rem); }
    .intro { margin: 0 0 24px; color: #58676d; }
    label { display: block; margin-bottom: 8px; font-weight: 600; }
    textarea {
      display: block;
      width: 100%;
      min-height: 150px;
      padding: 14px;
      border: 1px solid #ccd6d8;
      border-radius: 10px;
      background: #fff;
      color: inherit;
      font: 14px/1.6 Consolas, monospace;
      resize: vertical;
    }
    textarea:focus-visible, input:focus-visible + .image-placeholder {
      outline: 2px solid #b4232f;
      outline-offset: 2px;
    }
    .note { margin: 8px 0 24px; color: #58676d; font-size: .9rem; }
    .image-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .image-slot {
      position: relative;
      min-height: 135px;
      overflow: hidden;
      border: 1px dashed #aebcbe;
      border-radius: 10px;
      background: #fff;
    }
    .image-slot input {
      position: absolute;
      z-index: 2;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }
    .image-placeholder {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 12px;
      color: #58676d;
      text-align: center;
      font-size: .9rem;
    }
    .image-slot img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #fff;
    }
    .image-slot img[hidden] { display: none; }
    .image-slot.has-image .image-placeholder { display: none; }
    @media (max-width: 560px) {
      body { padding: 28px 16px; }
      .image-grid { grid-template-columns: repeat(2, 1fr); }
      .image-slot { min-height: 120px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Hướng dẫn nhanh</h1>
    <p class="intro">Xem hướng dẫn qua ảnh và nội dung bên dưới.</p>

    <label for="guideText">Nội dung</label>
    <textarea id="guideText" placeholder="Nhập nội dung hướng dẫn…" spellcheck="false"></textarea>
    <p class="note">Ô này chỉ hiển thị văn bản, không chạy mã.</p>

    <div class="image-grid" aria-label="Ảnh hướng dẫn">
      <div class="image-slot"><input type="file" accept="image/*" aria-label="Chọn ảnh hướng dẫn 1"><span class="image-placeholder">Ảnh 1</span><img alt="" hidden></div>
      <div class="image-slot"><input type="file" accept="image/*" aria-label="Chọn ảnh hướng dẫn 2"><span class="image-placeholder">Ảnh 2</span><img alt="" hidden></div>
      <div class="image-slot"><input type="file" accept="image/*" aria-label="Chọn ảnh hướng dẫn 3"><span class="image-placeholder">Ảnh 3</span><img alt="" hidden></div>
      <div class="image-slot"><input type="file" accept="image/*" aria-label="Chọn ảnh hướng dẫn 4"><span class="image-placeholder">Ảnh 4</span><img alt="" hidden></div>
      <div class="image-slot"><input type="file" accept="image/*" aria-label="Chọn ảnh hướng dẫn 5"><span class="image-placeholder">Ảnh 5</span><img alt="" hidden></div>
      <div class="image-slot"><input type="file" accept="image/*" aria-label="Chọn ảnh hướng dẫn 6"><span class="image-placeholder">Ảnh 6</span><img alt="" hidden></div>
    </div>
  </main>
  <script>
    document.querySelectorAll('.image-slot input').forEach((input) => {
      input.addEventListener('change', () => {
        const file = input.files && input.files[0];
        if (!file) return;

        const slot = input.closest('.image-slot');
        const image = slot.querySelector('img');
        if (image.src.startsWith('blob:')) URL.revokeObjectURL(image.src);
        image.src = URL.createObjectURL(file);
        image.hidden = false;
        slot.classList.add('has-image');
      });
    });
  </script>
</body>
</html>
