<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Bách khoa Dị thể | Lenhan</title>
<link rel="icon" href="../../../store/favicon.ico" sizes="any">
<script src="../../cache/setting.js"></script>
<script src="../../../js/loading.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700;900&family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--chrome:#141414;--chrome2:#202020;--chromeLine:#383838;--gold:#e2bd61;--blood:#a93443;--paper:#242424;--ink:#f1f1f1;--muted:#b5b5b5;--line:#4b4b4b;--link:#6ca9ff;--soft:#333;--mainBg:#241b19;--bodyText:#eee;--sidebarMuted:#a99c88;--controlBg:#171717;--controlText:#f1ece4;--tableBg:#1b1b1b;--tableHeader:#303030;--searchSurface:#242424}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;background:var(--chrome);color:var(--bodyText);font:14px/1.6 'Noto Sans',sans-serif}
button,input{font:inherit}
.layout{min-height:100vh;display:block}
.sidebar{position:fixed;inset:0 auto 0 0;z-index:120;display:flex;flex-direction:column;width:min(292px,calc(100vw - 44px));height:100dvh;overflow:hidden;background:var(--chrome);border-right:1px solid var(--chromeLine);transform:translateX(-102%);transition:transform .24s ease}
.sidebar.is-open{transform:translateX(0)}
.sidebar-backdrop{position:fixed;inset:0;z-index:110;border:0;background:rgba(0,0,0,.58);opacity:0;pointer-events:none;transition:opacity .24s ease}
.sidebar-backdrop.is-visible{opacity:1;pointer-events:auto}
.sidebar-open-button{position:fixed;top:50%;left:0;z-index:100;display:flex;align-items:center;justify-content:center;width:28px;height:56px;padding:0;border:1px solid var(--chromeLine);border-left:0;border-radius:0 5px 5px 0;background:var(--chrome2);color:#eee;cursor:pointer;box-shadow:0 3px 12px #0006;transform:translateY(-50%)}
.sidebar-open-button:hover{border-color:var(--gold);color:var(--gold)}
.sidebar-open-button[hidden]{display:none}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 18px 15px;border-bottom:1px solid var(--chromeLine)}
.brand h1{margin:0;color:var(--gold);font:900 19px/1.3 'Merriweather',serif}
.brand p{margin:5px 0 0;color:var(--sidebarMuted);font-size:11px}
.browse-toggle{display:grid;place-items:center;flex:none;width:27px;height:27px;padding:0;border:1px solid var(--chromeLine);border-radius:3px;background:var(--chrome2);color:#eee;font-size:17px;line-height:1;cursor:pointer}
.browse-toggle:hover{border-color:var(--gold);color:var(--gold)}
.groups.is-collapsed{display:none}
.browse-panel{display:flex;flex:1;min-height:0;overflow:hidden;flex-direction:column}
.tools{padding:12px 14px 10px;border-bottom:1px solid var(--chromeLine)}
.toolsRow{display:flex;align-items:center;gap:8px}
.search{width:100%;padding:9px 10px;border:1px solid #4b3935;border-radius:3px;background:var(--chrome2);color:#f5efe4;outline:none}
.search-trigger{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;flex:none;border:1px solid #4b3935;border-radius:50%;background:var(--chrome2);color:#e6ded1;cursor:pointer}
.search-trigger:hover,.search-trigger:focus-visible{border-color:var(--gold);color:var(--gold)}
.search-overlay{position:fixed;inset:0;z-index:200;display:flex;align-items:flex-start;justify-content:center;padding:12vh 20px 40px}
.search-overlay[hidden]{display:none}
.search-backdrop{position:absolute;inset:0;background:rgba(20,16,15,.72);backdrop-filter:blur(3px)}
.search-panel{position:relative;z-index:1;display:flex;flex-direction:column;width:100%;max-width:560px;max-height:70vh;overflow:hidden;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);box-shadow:0 30px 60px #0008}
.search-input-wrap{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.search-input-icon{flex:none;color:var(--muted)}
.search-input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);font:inherit;font-size:16px}
.search-close{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border:0;border-radius:4px;background:transparent;color:var(--muted);cursor:pointer}
.search-close:hover{background:var(--paper);color:var(--ink)}
.search-results{overflow:auto;padding:8px;-webkit-overflow-scrolling:touch}
.theme-picker-panel{max-height:min(70vh,460px);border-color:var(--chromeLine);background:var(--chrome);color:var(--bodyText)}
.theme-picker-heading{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--chromeLine);font:700 16px 'Merriweather',serif}
.theme-picker-options{display:grid;gap:6px;min-height:0;overflow:auto;padding:10px}
.theme-choice{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:10px 12px;border:1px solid var(--chromeLine);border-radius:4px;background:var(--chrome2);color:var(--bodyText);text-align:left;cursor:pointer}
.theme-choice:hover,.theme-choice[aria-checked="true"]{border-color:var(--gold);color:var(--gold)}
.theme-choice[aria-checked="true"]::after{content:"Đang dùng";font-size:11px}
.theme-picker-empty{margin:0;padding:18px;color:var(--muted);text-align:center;font-size:13px}
.theme-picker-shortcut{padding:0 16px 12px;color:var(--muted);font-size:11px}
.search-result{display:flex;flex-direction:column;gap:4px;padding:11px 12px;border-radius:4px;color:var(--ink);text-decoration:none}
.search-result-count{padding:6px 12px;color:var(--muted);font-size:11px}
.item-reference{color:var(--link);font-weight:600;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px}
.item-reference:hover{color:var(--gold)}
.item-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin:12px 0}
.item-card{display:flex;align-items:center;gap:11px;min-width:0;padding:10px;border:1px solid var(--chromeLine);border-radius:4px;background:var(--boxBg);color:var(--boxText);text-decoration:none}
.item-card:hover{border-color:var(--gold);background:var(--boxBgAlt)}
.item-card-image{display:grid;place-items:center;width:46px;height:46px;flex:none;border:1px solid var(--chromeLine);border-radius:4px;background:var(--chrome2);color:var(--gold);font:700 21px 'Merriweather',serif}
.item-card-image img{display:block;width:100%;height:100%;border-radius:3px;object-fit:cover}
.image-loading{position:relative;overflow:hidden}
.image-loading::before{position:absolute;inset:0;z-index:1;background:linear-gradient(100deg,transparent 20%,color-mix(in srgb,var(--boxText) 18%,transparent) 50%,transparent 80%);background-size:200% 100%;content:"";animation:image-loading-shimmer 1.2s ease-in-out infinite}
.image-loading img{opacity:0;transition:opacity .3s ease}
.image-loading.is-loaded img{opacity:1}
.image-loading.is-loaded::before,.image-loading.is-error::before{display:none}
.image-loading .item-image-placeholder{display:none}
.image-loading.is-error img{display:none}
.image-loading.is-error .item-image-placeholder{display:block}
@keyframes image-loading-shimmer{to{background-position:200% 0}}
@media(prefers-reduced-motion:reduce){.image-loading::before{animation:none}}
.item-search-controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:12px 0}
.item-search-error{margin:8px 0;padding:9px 11px;border:1px solid #ef5350;border-radius:3px;background:#4a1519;color:#ffe1e1;font-size:12px}
.item-image-placeholder{color:var(--boxMuted);font:500 36px/1 'Noto Sans',sans-serif;opacity:.28}
.item-card-info{display:grid;gap:2px;min-width:0}
.item-card-info strong{overflow:hidden;color:var(--boxText);text-overflow:ellipsis;white-space:nowrap}
.item-card-info span{overflow:hidden;color:var(--boxMuted);font-size:10px;text-overflow:ellipsis;white-space:nowrap}
.item-search{max-width:480px}
.item-profile-image{display:grid;place-content:center;justify-items:center;gap:6px;min-height:160px;background:var(--boxBgAlt);color:var(--gold)}
.item-profile-image .item-image-placeholder{font-size:72px}
.item-profile-image img{display:block;width:100%;max-height:320px;object-fit:contain}
.search-result:hover,.search-result.is-active{background:var(--paper)}
.search-result-tag{color:var(--blood);font-size:10px;text-transform:uppercase}
.search-result-title{font-size:14px;font-weight:700}
.search-result-desc{color:var(--muted);font-size:12px}
.search-result-title mark,.search-result-desc mark{border-radius:2px;background:#f4dda2;color:#382e19}
.search-empty,.search-hint{padding:28px 16px;color:var(--muted);text-align:center;font-size:13px}
.search:focus{border-color:var(--gold)}
.status{margin:8px 1px 0;color:#b8a990;font-size:11px}
.groupTitle{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:13px 12px 5px 16px;color:#a99c88;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.groups{padding:0 10px 8px;display:grid;grid-template-columns:1fr 1fr;gap:5px}
.groups:not(.is-collapsed){flex:none;max-height:154px;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}
.group{border:1px solid #3c2d2a;border-radius:3px;padding:6px 7px;background:transparent;color:#d9d0c2;text-align:left;font-size:10px;line-height:1.35;cursor:pointer}
.group:hover,.group.active{border-color:var(--gold);background:#2a201c;color:#fff}
.group span{display:block;margin-top:2px;color:#ae9e86;font-size:10px}
.list{overflow:auto;flex:1;border-top:1px solid var(--chromeLine);padding:5px 0}
.item{display:block;width:100%;padding:8px 14px 8px 16px;border:0;border-left:3px solid transparent;background:transparent;color:#e6ded1;text-align:left;text-decoration:none;cursor:pointer}
.item:hover{background:var(--chrome2)}
.item.active{border-left-color:#bd5d55;background:var(--chrome2)}
.itemName{display:block;font-size:12px;line-height:1.4}
.itemMeta{display:block;margin-top:2px;color:#aa9b86;font-size:10px}
.count{padding:9px 16px;border-top:1px solid var(--chromeLine);color:#a99c88;font-size:10px}
.main{min-width:0;overflow:auto;padding:32px 26px 60px;background:var(--mainBg)}
.wiki-nav{position:sticky;top:0;z-index:10;display:flex;min-width:0;align-items:center;gap:4px;margin:-32px -26px 24px;padding:10px 26px 0 68px;border-bottom:1px solid var(--chromeLine);background:var(--mainBg)}
.wiki-nav-scroll{display:flex;min-width:0;flex:1;align-items:center;gap:4px;overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;scrollbar-width:thin}
.wiki-brand{display:flex;align-items:center;gap:7px;flex:none;margin-right:8px;padding:6px 8px;color:var(--gold);font:900 13px/1 'Merriweather',serif;letter-spacing:.04em;text-decoration:none;white-space:nowrap}
.wiki-brand img{display:block;width:104px;height:auto}
.wiki-brand strong{color:var(--ink)}
.wiki-tab{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border:1px solid transparent;border-bottom:0;border-radius:3px 3px 0 0;color:#c8c1b8;text-decoration:none;font-size:12px;font-weight:600;white-space:nowrap}
.wiki-tab svg{width:16px;height:16px;flex:none}
.wiki-tab:hover,.wiki-tab.active{border-color:var(--chromeLine);background:var(--chrome2);color:var(--gold)}
.language-control{margin-left:auto}
.language-control select{min-height:32px;padding:6px 8px;border:1px solid var(--chromeLine);border-radius:3px;background:var(--chrome2);color:var(--ink);font:inherit;font-size:10px;cursor:pointer}
.language-control select:hover,.language-control select:focus-visible{border-color:var(--gold);outline:none}
.theme-button{padding:7px 10px;border:1px solid var(--chromeLine);border-radius:3px;background:var(--chrome2);color:var(--ink);font-size:10px;cursor:pointer;white-space:nowrap}
.theme-button:hover{border-color:var(--gold);color:var(--gold)}
.wiki-settings{position:relative;flex:none;margin-left:8px}
.wiki-settings summary{display:grid;place-items:center;width:34px;height:34px;border:1px solid var(--chromeLine);border-radius:3px;background:var(--chrome2);color:var(--ink);font-size:17px;cursor:pointer;list-style:none}
.wiki-settings summary::-webkit-details-marker{display:none}
.wiki-settings[open] summary,.wiki-settings summary:hover{border-color:var(--gold);color:var(--gold)}
.wiki-settings-panel{position:absolute;top:calc(100% + 8px);right:0;z-index:20;display:grid;gap:8px;min-width:150px;padding:10px;border:1px solid var(--chromeLine);border-radius:4px;background:var(--paper);box-shadow:0 12px 28px #0007}
.wiki-settings-panel .language-control{margin:0}
.wiki-settings-panel .language-control select,.wiki-settings-panel .theme-button{width:100%;min-height:36px;font-size:12px}
.wiki-settings-panel .language-control select{text-align:center}
.wiki-settings-panel .theme-button{white-space:normal}
.font-size-control{display:grid;gap:5px;color:var(--boxText);font-size:12px}
.font-size-control span{display:flex;justify-content:space-between;gap:10px}
.font-size-control input{width:100%;margin:0;accent-color:var(--gold);cursor:pointer}
.wiki{font-size:var(--wiki-reading-size,20px)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.mini-actions{position:fixed;right:18px;bottom:18px;z-index:160;display:grid;justify-items:center;gap:8px}
.mini-actions-list{display:grid;justify-items:center;gap:8px;max-height:0;overflow:hidden;opacity:0;transform:translateY(10px);transition:max-height .22s ease,opacity .18s ease,transform .22s ease}
.mini-actions.is-open .mini-actions-list{max-height:180px;opacity:1;transform:translateY(0)}
.mini-action,.mini-actions-toggle{display:grid;place-items:center;width:42px;height:42px;padding:0;border:1px solid var(--chromeLine);border-radius:50%;background:var(--chrome2);color:var(--ink);box-shadow:0 4px 14px #0005;cursor:pointer;transition:transform .16s ease,border-color .16s ease,color .16s ease,background .16s ease}
.mini-actions-toggle{width:48px;height:48px;background:var(--gold);color:var(--accentText);border-color:var(--gold)}
.mini-action:hover,.mini-action:focus-visible,.mini-actions-toggle:hover,.mini-actions-toggle:focus-visible{transform:translateY(-2px);border-color:var(--gold);color:var(--gold)}
.mini-actions-toggle:hover,.mini-actions-toggle:focus-visible{background:var(--gold);color:var(--accentText)}
.mini-action:focus-visible,.mini-actions-toggle:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.mini-action:disabled{opacity:.4;cursor:not-allowed;transform:none}
.mini-actions-label{position:absolute;right:calc(100% + 9px);padding:6px 9px;border:1px solid var(--chromeLine);border-radius:4px;background:var(--chrome);color:var(--bodyText);font-size:11px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s ease}
.mini-action:hover .mini-actions-label,.mini-action:focus-visible .mini-actions-label{opacity:1}
.mini-action{position:relative}
.mini-actions-toggle .icon-close{display:none}
.mini-actions.is-open .mini-actions-toggle .icon-menu{display:none}
.mini-actions.is-open .mini-actions-toggle .icon-close{display:block}
.load-more{display:block;width:calc(100% - 20px);margin:10px auto;padding:9px 12px;border:1px solid var(--chromeLine);border-radius:4px;background:var(--chrome2);color:var(--controlText);font-size:12px;font-weight:700;cursor:pointer}
.load-more:hover,.load-more:focus-visible{border-color:var(--gold);color:var(--gold)}
.load-more:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.view-title{margin:0 0 8px;color:var(--gold);font:700 24px/1.35 'Merriweather',serif}
.view-lead{margin:0 0 20px;color:#c2b9ad;font-size:13px}
.view-toolbar{display:flex;flex-wrap:wrap;align-items:end;gap:10px;margin:0 0 16px;padding:12px;border:1px solid var(--chromeLine);background:var(--chrome2)}
.view-control{display:grid;gap:4px;min-width:145px;color:#c9c0b4;font-size:10px}
.view-control input,.view-control select{width:100%;min-height:34px;padding:6px 8px;border:1px solid var(--chromeLine);border-radius:3px;background:var(--controlBg);color:var(--controlText);font:inherit;font-size:12px}
.view-control input[type=range]{padding:0;accent-color:var(--gold)}
.view-control input[type=checkbox]{width:16px;min-height:16px;accent-color:var(--gold)}
.element-browser{margin-top:24px}
.element-browser-title{margin:0 0 12px;color:#e9dfd1;font:700 17px 'Merriweather',serif}
.simulation-box{display:grid;gap:14px;margin:16px 0 24px;padding:16px;border:1px solid #5a4a36;border-radius:4px;background:#1b1917;box-shadow:inset 0 0 0 1px #0005}
.simulation-heading{display:flex;align-items:flex-end;justify-content:space-between;gap:16px}
.simulation-heading h2{margin:0;color:#f0e6d6;font:700 17px 'Merriweather',serif}
.simulation-heading p{margin:5px 0 0;color:#b9b0a4;font-size:11px}
.simulation-creature{width:min(100%,340px)}
.simulation-tags{display:flex;flex-wrap:wrap;gap:6px;padding:10px;border:1px solid var(--chromeLine);border-radius:3px;background:#111}
.simulation-tag{padding:5px 9px;border:1px solid var(--chromeLine);border-radius:3px;background:#202020;color:#ded5c8;font-size:11px;cursor:pointer}
.simulation-tag:hover,.simulation-tag.selected{border-color:var(--gold);background:#392f1c;color:#ffdf8a}
.simulation-selected{display:grid;gap:8px}
.simulation-chip{display:grid;grid-template-columns:minmax(110px,1fr) auto auto;align-items:center;gap:10px;padding:8px 10px;border:1px solid #544530;border-radius:3px;background:#211d17}
.simulation-chip-label{display:grid;gap:2px;color:#f0e6d6;font-size:11px}
.simulation-chip-label span{color:#aaa092;font-size:10px}
.simulation-stepper{display:flex;align-items:center;gap:4px}
.simulation-stepper button{display:grid;place-items:center;width:30px;height:32px;border:1px solid var(--chromeLine);border-radius:3px;background:#171717;color:#eee;font-size:16px;cursor:pointer}
.simulation-stepper button:hover{border-color:var(--gold);color:var(--gold)}
.simulation-stepper input{width:76px;height:32px;padding:4px 6px;border:1px solid var(--chromeLine);border-radius:3px;background:#111;color:#fff;text-align:center;font:inherit;font-size:12px}
.simulation-remove{width:28px;height:28px;border:1px solid #674434;border-radius:3px;background:#38251f;color:#f3d1c4;font-size:17px;cursor:pointer}
.simulation-remove:hover{background:var(--blood);color:white}
.simulation-actions{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.simulation-add{width:min(100%,340px)}
.simulation-buttons{display:flex;gap:8px}
.simulation-apply,.simulation-reset{min-height:34px;padding:6px 12px;border:1px solid var(--gold);border-radius:3px;background:#4a3c1d;color:#ffe7a8;font-size:11px;font-weight:700;cursor:pointer}
.simulation-reset{border-color:var(--chromeLine);background:#202020;color:#ddd}
.simulation-apply:disabled,.simulation-reset:disabled{opacity:.42;cursor:default}
.simulation-summary{margin:0 0 8px;color:#ddd1bd;font-size:12px}
.simulation-empty{margin:0;padding:10px;border:1px dashed var(--chromeLine);color:#b9b0a4;font-size:11px}
.range-control{display:grid;grid-template-columns:1fr 1fr;gap:8px;min-width:min(100%,280px)}
.range-control output{grid-column:1/-1;color:#f1ece4;font-size:12px}
.result-count{margin:8px 0;color:#b8a990;font-size:11px}
.record-table{width:100%;border-collapse:collapse;background:var(--tableBg);font-size:12px}
.record-table th,.record-table td{padding:9px 10px;border:1px solid var(--line);text-align:left;vertical-align:top}
.record-table th{background:var(--tableHeader);color:var(--ink);font-size:11px}
.record-table td{color:#e5dfd6}
.record-link{padding:0;border:0;background:none;color:var(--link);font:inherit;text-align:left;text-decoration:none;cursor:pointer}
.record-link:hover{text-decoration:underline}
.catalog-tags{display:flex;flex-wrap:wrap;gap:4px;min-width:130px}
.catalog-tag{padding:2px 6px;border:1px solid var(--chromeLine);border-radius:3px;background:var(--chrome2);color:#e8d8bd;font:inherit;font-size:10px;cursor:pointer}
.catalog-tag:hover{border-color:var(--gold);color:var(--gold)}
.tag-filter-box{display:grid;gap:10px;margin:0 0 16px;padding:12px;border:1px solid #5a4a36;border-radius:4px;background:#1b1917;box-shadow:inset 0 0 0 1px #0005}
.tag-filter-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;color:#e8ddcb;font-size:12px}
.tag-clear-all{padding:5px 8px;border:1px solid var(--chromeLine);border-radius:3px;background:var(--chrome2);color:#d9cdbb;font-size:10px;cursor:pointer}
.tag-clear-all:hover:not(:disabled){border-color:var(--blood);color:#ffb4bd}
.tag-clear-all:disabled{opacity:.45;cursor:default}
.selected-tags{display:flex;flex-wrap:wrap;align-content:flex-start;gap:6px;min-height:54px;padding:9px;border:1px solid var(--chromeLine);border-radius:3px;background:#111;}
.selected-tag{display:inline-flex;align-items:center;gap:5px;max-width:100%;padding:4px 6px 4px 9px;border:1px solid #674434;border-radius:3px;background:#38251f;color:#f4e4d1;font-size:11px;overflow-wrap:anywhere}
.selected-tag button{display:inline-grid;place-items:center;width:19px;height:19px;flex:none;border:0;border-radius:2px;background:#51312a;color:#f3d1c4;font-size:15px;line-height:1;cursor:pointer}
.selected-tag button:hover{background:var(--blood);color:white}
.tag-empty{align-self:center;color:#91887d;font-size:11px}
.tag-add-control{max-width:360px}
.record-summary{max-width:480px;color:#bcb5aa}

<script id="java-data-function" src="../../../../store/java/java_data_function.js"></script>
<script>
(() => {
	const fontSizeControl = document.getElementById("wikiFontSize");
	const fontSizeValue = document.getElementById("wikiFontSizeValue");
	const fontSizeStorageKey = "oriciin:lenhan:font-size";
	const defaultFontSize = 20;
	fontSizeControl.value = String(defaultFontSize);

	try {
		const savedFontSize = window.localStorage.getItem(fontSizeStorageKey);
		if (savedFontSize !== null) {
			const parsedFontSize = Number(savedFontSize);
			if (Number.isInteger(parsedFontSize) && parsedFontSize >= 12 && parsedFontSize <= 32) {
				fontSizeControl.value = String(parsedFontSize);
			} else {
				console.warn("Cỡ chữ đã lưu không hợp lệ; sử dụng cỡ chữ mặc định.");
			}
		}
	} catch (error) {
		console.error("Không thể đọc cỡ chữ đã lưu:", error);
	}

	function applyFontSize() {
		const fontSize = Number(fontSizeControl.value);
		document.documentElement.style.setProperty("--wiki-reading-size", `${fontSize}px`);
		fontSizeValue.value = `${fontSize}px`;
		fontSizeValue.textContent = `${fontSize}px`;
	}

	fontSizeControl.addEventListener("input", applyFontSize);
	fontSizeControl.addEventListener("change", () => {
		try {
			window.localStorage.setItem(fontSizeStorageKey, fontSizeControl.value);
		} catch (error) {
			console.error("Không thể lưu cỡ chữ:", error);
		}
	});
	applyFontSize();
})();
</script>
