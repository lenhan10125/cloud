<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ôn tập Lịch sử Giữa kì I - 56 Câu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-between p-4 md:p-8">

    <!-- Header -->
    <header class="w-full max-w-4xl bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
        <div>
            <h1 class="text-2xl md:text-3xl font-bold text-indigo-400">Ôn tập Lịch sử Giữa kì I</h1>
            <p class="text-slate-400 text-sm mt-1">Trọn bộ 56 câu hỏi trắc nghiệm ôn tập cận đại & hiện đại</p>
        </div>
        <div class="flex items-center gap-4 bg-slate-900/60 px-4 py-2 rounded-xl border border-slate-700">
            <div class="text-center">
                <span class="text-xs text-slate-400 block">Tiến độ</span>
                <span id="progress-text" class="font-bold text-emerald-400">1 / 56</span>
            </div>
            <div class="h-8 w-px bg-slate-700"></div>
            <div class="text-center">
                <span class="text-xs text-slate-400 block">Điểm số</span>
                <span id="score-text" class="font-bold text-indigo-400">0</span>
            </div>
        </div>
        <button onclick="openSettings()" class="px-4 py-2 rounded-xl bg-slate-700 hover:bg-slate-600 text-slate-200 text-sm font-medium transition">
            Cài đặt
        </button>
    </header>

    <!-- Main Quiz Container -->
    <main id="app-container" class="w-full max-w-4xl bg-slate-800 border border-slate-700 rounded-2xl p-6 md:p-8 shadow-2xl flex-1 flex flex-col justify-between">
        
        <!-- Question Box -->
        <div id="question-panel">
            <div class="flex justify-between items-center mb-6">
                <span id="question-badge" class="px-3 py-1 bg-indigo-500/20 text-indigo-300 text-xs font-semibold rounded-full border border-indigo-500/30">Câu hỏi 1</span>
                <button onclick="toggleGrid()" class="text-xs text-slate-400 hover:text-indigo-300 underline transition">Mở danh sách câu hỏi</button>
            </div>

            <h2 id="question-title" class="text-lg md:text-xl font-medium text-slate-200 mb-6 leading-relaxed">
                Đang tải câu hỏi...
            </h2>

            <!-- Options Grid -->
            <div id="options-container" class="space-y-3 mb-6">
                <!-- Options will be injected here -->
            </div>

            <!-- Feedback / Rationale -->
            <div id="feedback-box" class="hidden p-4 rounded-xl border text-sm mb-6"></div>
        </div>

        <!-- Navigation Controls -->
        <div id="navigation-controls" class="flex justify-between items-center pt-6 border-t border-slate-700">
            <button onclick="prevQuestion()" id="prev-btn" class="px-5 py-2.5 rounded-xl bg-slate-700 hover:bg-slate-600 text-slate-200 font-medium transition disabled:opacity-40 disabled:cursor-not-allowed">
                Quay lại
            </button>
            <button onclick="nextQuestion()" id="next-btn" class="px-6 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-medium shadow-lg shadow-indigo-600/30 transition">
                Câu tiếp theo
            </button>
        </div>

        <section id="results-panel" class="hidden" aria-live="polite">
            <h2 class="text-2xl font-bold text-indigo-300 mb-2">Kết quả bài ôn tập</h2>
            <p id="results-score" class="text-slate-200 mb-2"></p>
            <p id="results-unanswered" class="text-amber-300 text-sm mb-6"></p>
            <div class="flex flex-wrap gap-3 mb-6">
                <button id="review-wrong-btn" onclick="toggleWrongReview()" aria-controls="wrong-review" aria-expanded="false" class="px-5 py-2.5 rounded-xl bg-rose-700 hover:bg-rose-600 text-white font-medium transition">
                    Xem lại câu sai
                </button>
                <button onclick="restartQuiz()" class="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-medium transition">
                    Làm lại
                </button>
            </div>
            <div id="wrong-review" class="hidden space-y-4" aria-label="Danh sách câu trả lời sai"></div>
            <p id="no-wrong-answers" class="hidden text-emerald-300 text-sm"></p>
        </section>
    </main>

    <!-- Question Drawer / Modal -->
    <div id="grid-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-2xl p-6 shadow-2xl max-h-[80vh] flex flex-col">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-slate-200">Danh sách 56 câu hỏi</h3>
                <button onclick="toggleGrid()" class="text-slate-400 hover:text-white text-lg font-bold">&times;</button>
            </div>
            <div id="question-grid" class="grid grid-cols-6 sm:grid-cols-8 gap-2 overflow-y-auto p-2 flex-1">
                <!-- Grid buttons injected here -->
            </div>
            <div class="mt-4 pt-3 border-t border-slate-700 text-right">
                <button onclick="toggleGrid()" class="px-4 py-2 bg-indigo-600 text-white rounded-xl text-sm font-medium">Đóng</button>
            </div>
        </div>
    </div>

    <dialog id="settings-modal" class="w-full max-w-md bg-slate-800 text-slate-100 border border-slate-700 rounded-2xl p-6 shadow-2xl">
        <form method="dialog">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-lg font-bold">Cài đặt hiển thị</h3>
                <button aria-label="Đóng cài đặt" class="text-slate-400 hover:text-white text-2xl leading-none">&times;</button>
            </div>
            <div class="space-y-6">
                <label class="block">
                    <span class="flex justify-between text-sm text-slate-300 mb-2">
                        <span>Cỡ chữ câu hỏi và đáp án</span>
                        <span><output id="font-size-value">16</output> px</span>
                    </span>
                    <input id="font-size-setting" type="range" min="14" max="24" step="1" value="16" class="w-full accent-indigo-500">
                </label>
                <label class="flex items-center justify-between gap-4 text-sm text-slate-300">
                    <span>Màu nền trang</span>
                    <input id="background-color-setting" type="color" value="#0f172a" aria-label="Chọn màu nền trang" class="h-10 w-14 cursor-pointer rounded border border-slate-600 bg-slate-700 p-1">
                </label>
                <div class="border-t border-slate-700 pt-5 space-y-4">
                    <div>
                        <label for="current-exam-code" class="block text-sm text-slate-300 mb-2">Mã đề hiện tại (gửi mã này để tạo cùng thứ tự câu hỏi)</label>
                        <input id="current-exam-code" type="text" readonly class="w-full rounded-xl border border-slate-600 bg-slate-900 px-3 py-2 font-mono tracking-wider text-emerald-300">
                    </div>
                    <button type="button" onclick="generateNewExamCode()" class="w-full px-4 py-2 rounded-xl bg-slate-700 hover:bg-slate-600 text-slate-200 text-sm font-medium transition">
                        Tạo mã đảo mới
                    </button>
                    <div>
                        <label for="exam-code-input" class="block text-sm text-slate-300 mb-2">Nhập mã đề để làm cùng thứ tự câu hỏi</label>
                        <div class="flex gap-2">
                            <input id="exam-code-input" type="text" maxlength="8" placeholder="Ví dụ: 1A2B3C4D" autocomplete="off" autocapitalize="characters" spellcheck="false" class="min-w-0 flex-1 rounded-xl border border-slate-600 bg-slate-900 px-3 py-2 font-mono uppercase text-slate-100 placeholder:text-slate-500">
                            <button type="button" onclick="applyEnteredExamCode()" class="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium transition">
                                Áp dụng
                            </button>
                        </div>
                    </div>
                    <p id="exam-code-status" class="hidden text-sm" role="status" aria-live="polite"></p>
                </div>
            </div>
            <div class="flex justify-end gap-3 mt-8">
                <button type="button" onclick="resetSettings()" class="px-4 py-2 rounded-xl bg-slate-700 hover:bg-slate-600 text-slate-200 text-sm font-medium transition">Mặc định</button>
                <button class="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium transition">Xong</button>
            </div>
        </form>
    </dialog>

    <!-- Footer -->
    <footer class="mt-6 text-center text-slate-500 text-xs">
        Ôn tập Lịch sử Giữa kì I - Chúc bạn ôn thi đạt kết quả cao nhất!
    </footer>

    <script>
        const questions = [
            {
                id: 1,
                question: "Tiền đề về kinh tế của các cuộc cách mạng tư sản từ giữa thế kỉ XVI đến đầu thế kỉ XX là",
                options: [
                    "Quan hệ sản xuất tư bản chủ nghĩa thay thế hoàn toàn quan hệ phong kiến.",
                    "Triết học Ánh sáng ra đời, dọn đường cho quần chúng đấu tranh.",
                    "Giai cấp tư sản có thế lực cả về kinh tế và chính trị.",
                    "Kinh tế tư bản chủ nghĩa ra đời, phát triển trong lòng chế độ phong kiến."
                ],
                correct: 3,
                rationale: "Kinh tế tư bản chủ nghĩa ra đời và phát triển trong lòng chế độ phong kiến chính là tiền đề vật chất quan trọng thúc đẩy các cuộc cách mạng tư sản bùng nổ."
            },
            {
                id: 2,
                question: "Các cuộc cách mạng tư sản từ giữa thế kỉ XVI đến đầu thế kỉ XX thắng lợi có ý nghĩa là",
                options: [
                    "Lật đổ nền quân chủ chuyên chế tồn tại lâu đời.",
                    "Giải quyết triệt để mọi yêu cầu của nông dân.",
                    "Xóa bỏ được tình trạng áp bức trong xã hội.",
                    "Đưa giai cấp công nhân lên nắm chính quyền."
                ],
                correct: 0,
                rationale: "Các cuộc cách mạng tư sản thắng lợi đã lật đổ nền quân chủ chuyên chế (hoặc ách thống trị thực dân), mở đường cho chủ nghĩa tư bản phát triển."
            },
            {
                id: 3,
                question: "Một trong những lực lượng lãnh đạo các cuộc cách mạng tư sản từ giữa thế kỉ XVI đến đầu thế kỉ XX là",
                options: ["Phong kiến", "Quý tộc mới.", "Tăng lữ.", "Nông dân."],
                correct: 1,
                rationale: "Bên cạnh giai cấp tư sản, quý tộc mới (ở Anh) cũng là lực lượng lãnh đạo tiêu biểu trong các cuộc cách mạng tư sản thời cận đại."
            },
            {
                id: 4,
                question: "Đầu thế kỉ XVII, ngành công nghiệp phát triển nhất ở nước Anh là",
                options: ["Luyện kim.", "Máy hơi nước.", "Len, dạ.", "Chế tạo máy móc."],
                correct: 2,
                rationale: "Lĩnh vực sản xuất len, dạ đóng vai trò quan trọng đặc biệt và phát triển mạnh mẽ nhất ở nước Anh đầu thế kỉ XVII."
            },
            {
                id: 5,
                question: "Kết quả của cuộc cách mạng tư sản Anh thời cận đại là lật đổ",
                options: ["Chế độ phong kiến.", "Chế độ cộng hòa.", "Chế độ quân chủ lập hiến.", "Sự thống trị của thực dân Anh."],
                correct: 0,
                rationale: "Cách mạng tư sản Anh đã lật đổ chế độ phong kiến chuyên chế (đứng đầu là vua Sác-lơ I), thiết lập chế độ quân chủ lập hiến."
            },
            {
                id: 6,
                question: "Đến giữa thế kỉ XVIII, miền Bắc của 13 thuộc địa Anh ở Bắc Mĩ phát triển phổ biến",
                options: ["Kinh tế đồn điền.", "Công trường thủ công.", "Dệt và làm gốm.", "Phường hội thủ công."],
                correct: 1,
                rationale: "Miền Bắc 13 thuộc địa Anh ở Bắc Mĩ phát triển phổ biến kinh tế công thương nghiệp và công trường thủ công, trong khi miền Nam phát triển đồn điền."
            },
            {
                id: 7,
                question: "Đẳng cấp 3 trong xã hội Pháp trước cách mạng gồm",
                options: ["Tư sản, nông dân, bình dân thành thị.", "Quý tộc, nông dân, tăng lữ, thợ thủ công.", "Tăng lữ, quý tộc và tư sản, nông dân.", "Vua, quan lại, tăng lữ, bình dân thành thị."],
                correct: 0,
                rationale: "Đẳng cấp thứ ba trong xã hội Pháp trước cách mạng bao gồm giai cấp tư sản, nông dân và bình dân thành thị (không có đặc quyền, chịu mọi thứ thuế)."
            },
            {
                id: 8,
                question: "Trào lưu “Triết học ánh sáng” cuối thế kỉ XVIII dọn đường cho cuộc cách mạng tư sản ở",
                options: ["Anh", "Pháp.", "Đức.", "Mĩ."],
                correct: 1,
                rationale: "Trào lưu Triết học Ánh sáng thế kỉ XVIII phát triển mạnh mẽ tại Pháp, kịch liệt phê phán chế độ phong kiến và dọn đường cho Cách mạng tư sản Pháp."
            },
            {
                id: 9,
                question: "Đầu thế kỉ XIX, các nước Mĩ La tinh giành độc lập từ tay thực dân",
                options: ["Tây Ban Nha và Bồ Đào Nha.", "Anh và đế quốc Mĩ.", "Tây Ban Nha và Pháp.", "Pháp và Đức."],
                correct: 0,
                rationale: "Đầu thế kỉ XIX, nhân dân Mĩ La tinh đã nổi dậy lật đổ ách thống trị của thực dân Tây Ban Nha và Bồ Đào Nha để giành độc lập."
            },
            {
                id: 10,
                question: "Nửa sau thế kỷ XIX, sự kiện nào đánh dấu chủ nghĩa tư bản được xác lập ở Mỹ?",
                options: ["Chiến tranh giành độc lập ở Bắc Mỹ.", "Nước Mỹ trở thành nước cộng hoà.", "Giai cấp tư sản công thương ở Mỹ giành thắng lợi.", "Giai cấp tư sản Mỹ đã nắm chính quyền (thông qua Cuộc Nội chiến 1861 - 1865)."],
                correct: 3,
                rationale: "Cuộc Nội chiến (1861 - 1865) đã giải phóng nô lệ, tạo điều kiện cho giai cấp tư sản Mỹ nắm chính quyền và xác lập hoàn toàn chủ nghĩa tư bản ở Mĩ."
            },
            {
                id: 11,
                question: "Sau các cuộc cách mạng tư sản, chủ nghĩa tư bản từng bước được xác lập ở",
                options: ["Châu Âu và Bắc Mĩ.", "Tây Âu và châu Á.", "Bắc Mĩ và Nam Á.", "Châu Á và châu Phi."],
                correct: 0,
                rationale: "Chủ nghĩa tư bản sau các cuộc cách mạng tư sản đã từng bước thắng lợi và xác lập ở khu vực châu Âu và Bắc Mĩ."
            },
            {
                id: 12,
                question: "Nửa sau thế kỉ XIX, hầu hết các cuộc cách mạng tư sản đã",
                options: ["Giành được thắng lợi.", "Hoàn toàn sụp đổ.", "Bắt đầu từ nông nghiệp.", "Giải phóng dân tộc."],
                correct: 0,
                rationale: "Nửa sau thế kỉ XIX, với sự tham gia của đông đảo quần chúng, hầu hết các cuộc cách mạng tư sản đã giành được thắng lợi."
            },
            {
                id: 13,
                question: "Hình thức tổ chức độc quyền phổ biến ở Đức cuối thế kỉ XIX - đầu thế kỉ XX là",
                options: ["Các-ten và Xanh-đi-ca.", "Tơ-rớt và Các-ten.", "Xanh-đi-ca và Tơ-rớt.", "Dai-bát-xư và Tơ-rớt."],
                correct: 0,
                rationale: "Ở Đức, hình thức tổ chức độc quyền phổ biến là Các-ten và Xanh-đi-ca, trong khi ở Mĩ phổ biến là Tơ-rớt."
            },
            {
                id: 14,
                question: "Nối nội dung ở cột A với thời gian ở cột B cho phù hợp: (1. CNTB xác lập - b; 2. CNTB chuyển sang độc quyền - c; 3. CNTB hiện đại - a)",
                options: ["1a, 2b, 3c.", "1b, 2c, 3a.", "1c, 2a, 3b.", "1b, 2a, 3c."],
                correct: 1,
                rationale: "1. CNTB xác lập (Thế kỉ XVII - cuối thế kỉ XIX); 2. CNTB chuyển từ tự do cạnh tranh sang độc quyền (Cuối thế kỉ XIX - giữa thế kỉ XX); 3. CNTB hiện đại (Giữa thế kỉ XX đến nay)."
            },
            {
                id: 15,
                question: "Nước có hệ thống thuộc địa rộng nhất thế giới vào cuối thế kỉ XIX - đầu thế kỉ XX là",
                options: ["Pháp.", "Anh.", "Mĩ.", "Đức."],
                correct: 1,
                rationale: "Anh là đế quốc thực dân có hệ thống thuộc địa lớn nhất thế giới (\"đế quốc mặt trời không bao giờ lặn\") vào cuối thế kỉ XIX - đầu thế kỉ XX."
            },
            {
                id: 16,
                question: "Ở châu Á, nước nào sau đây thoát khỏi thân phận nước thuộc địa và trở thành nước đế quốc?",
                options: ["Việt Nam.", "Ca-na-đa.", "Ấn Độ.", "Nhật Bản."],
                correct: 3,
                rationale: "Nhật Bản qua cuộc Duy tân Minh Trị (1868) đã thoát khỏi nguy cơ trở thành thuộc địa và phát triển thành nước tư bản chủ nghĩa/đế quốc chủ nghĩa."
            },
            {
                id: 17,
                question: "Một trong những ý nghĩa của bản “Tuyên ngôn Nhân quyền và Dân quyền” trong cách mạng tư sản Pháp cuối thế kỉ XVIII là",
                options: ["Đề cao quyền công dân và quyền con người.", "Bảo vệ quyền lợi cho tất cả các tầng lớp trong xã hội.", "Bảo vệ quyền lợi cho giai cấp tư sản.", "Khẳng định quyền tư hữu là thiêng liêng, bất khả xâm phạm."],
                correct: 0,
                rationale: "Bản Tuyên ngôn đề cao các quyền tự do, bình đẳng, quyền công dân và quyền con người, mang tính chất tư sản tiến bộ."
            },
            {
                id: 18,
                question: "Trong cách mạng tư sản Pháp cuối thế kỷ XVIII, trào lưu Triết học Ánh sáng không có nội dung nào sau đây?",
                options: ["Lên án chế độ tư bản chủ nghĩa.", "Lên án chế độ phong kiến.", "Tấn công hệ tư tưởng chế độ phong kiến.", "Xây dựng chế độ xã hội tiến bộ."],
                correct: 0,
                rationale: "Triết học Ánh sáng tấn công chế độ phong kiến chứ không lên án chế độ tư bản chủ nghĩa (vì đây là hệ tư tưởng dọn đường cho tư sản)."
            },
            {
                id: 19,
                question: "Cách mạng tư sản Pháp (cuối thế kỉ XVIII) được đánh giá là cuộc cách mạng tư sản triệt để nhất thời cận đại vì",
                options: [
                    "Giai cấp tư sản liên minh với quý tộc lãnh đạo cách mạng.",

        ];
        const originalQuestions = questions.slice();

        let currentIndex = 0;
        let userAnswers = new Array(questions.length).fill(null);
        let score = 0;
        let wrongReviewVisible = false;
        let examCode = '';

        function initApp() {
            document.getElementById('font-size-setting').addEventListener('input', applyFontSize);
            document.getElementById('background-color-setting').addEventListener('input', applyBackgroundColor);
            examCode = createExamCode();
            setExamCode(examCode);
        }

        function createExamCode() {
            const values = new Uint32Array(1);
            window.crypto.getRandomValues(values);
            return values[0].toString(16).padStart(8, '0').toUpperCase();
        }

        function shuffleQuestions(code) {
            const shuffled = originalQuestions.slice();
            let seed = Number.parseInt(code, 16) >>> 0;
            const random = () => {
                seed = (seed + 0x6D2B79F5) >>> 0;
                let value = seed;
                value = Math.imul(value ^ (value >>> 15), value | 1);
                value ^= value + Math.imul(value ^ (value >>> 7), value | 61);
                return ((value ^ (value >>> 14)) >>> 0) / 4294967296;
            };

            for (let index = shuffled.length - 1; index > 0; index--) {
                const swapIndex = Math.floor(random() * (index + 1));
                [shuffled[index], shuffled[swapIndex]] = [shuffled[swapIndex], shuffled[index]];
            }

            return shuffled;
        }

        function updateExamCodeStatus(message, isError = false) {
            const status = document.getElementById('exam-code-status');
            status.innerText = message;
            status.className = `text-sm ${isError ? 'text-rose-300' : 'text-emerald-300'}`;
        }

        function canChangeExamCode() {
            const hasAnswers = userAnswers.some(answer => answer !== null);
            return !hasAnswers || window.confirm('Đổi mã đề sẽ xóa câu trả lời và điểm hiện tại. Bạn có muốn tiếp tục không?');
        }

        function setExamCode(code) {
            examCode = code;
            questions.splice(0, questions.length, ...shuffleQuestions(code));
            document.getElementById('current-exam-code').value = code;
            document.getElementById('exam-code-input').value = code;
            restartQuiz();
        }

        function generateNewExamCode() {
            if (!canChangeExamCode()) return;

            let nextCode = createExamCode();
            while (nextCode === examCode) {
                nextCode = createExamCode();
            }

            setExamCode(nextCode);
            updateExamCodeStatus('Đã tạo đề mới. Chia sẻ mã đề hiện tại để người khác nhận cùng thứ tự câu hỏi.');
        }

        function applyEnteredExamCode() {
            const code = document.getElementById('exam-code-input').value.trim().toUpperCase();
            if (!/^[0-9A-F]{8}$/.test(code)) {
                updateExamCodeStatus('Mã đề không hợp lệ. Mã cần gồm đúng 8 ký tự từ 0–9 hoặc A–F.', true);
                return;
            }
            if (code === examCode) {
                updateExamCodeStatus('Đây đã là mã đề hiện tại; thứ tự câu hỏi không thay đổi.');
                return;
            }
            if (!canChangeExamCode()) return;

            setExamCode(code);
            updateExamCodeStatus('Đã áp dụng mã đề. Thứ tự câu hỏi hiện khớp với mã đã nhập.');
        }

        function openSettings() {
            document.getElementById('settings-modal').showModal();
        }

        function applyFontSize() {
            const size = document.getElementById('font-size-setting').value;
            document.documentElement.style.setProperty('--quiz-font-size', `${size}px`);
            document.getElementById('font-size-value').value = size;
        }

        function applyBackgroundColor() {
            document.body.style.backgroundColor = document.getElementById('background-color-setting').value;
        }

        function resetSettings() {
            document.getElementById('font-size-setting').value = '16';
            document.getElementById('background-color-setting').value = '#0f172a';
            applyFontSize();
            applyBackgroundColor();
        }

        function renderQuestion() {
            const q = questions[currentIndex];
            document.getElementById('question-badge').innerText = `Câu hỏi ${currentIndex + 1} / ${questions.length}`;
            document.getElementById('question-title').innerText = q.question;

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            const feedbackBox = document.getElementById('feedback-box');
            const isAnswered = userAnswers[currentIndex] !== null;

            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-4 rounded-xl border transition flex items-center justify-between font-medium text-sm md:text-base `;
                
                if (!isAnswered) {
                    btn.className += `bg-slate-700/50 border-slate-600 hover:bg-indigo-600/20 hover:border-indigo-500 text-slate-200`;
                    btn.onclick = () => selectAnswer(idx);
                } else {
                    if (idx === q.correct) {
                        btn.className += `bg-emerald-900/40 border-emerald-500 text-emerald-200`;
                    } else if (userAnswers[currentIndex] === idx) {
                        btn.className += `bg-rose-900/40 border-rose-500 text-rose-200`;
                    } else {
                        btn.className += `bg-slate-800/40 border-slate-700 text-slate-400 opacity-60`;
                    }
                    btn.disabled = true;
                }

                btn.innerHTML = `<span><strong class="mr-2 text-indigo-400">${String.fromCharCode(65 + idx)}.</strong> ${opt}</span>`;
                optionsContainer.appendChild(btn);
            });

            if (isAnswered) {
                feedbackBox.classList.remove('hidden');
                const isCorrect = userAnswers[currentIndex] === q.correct;
                if (isCorrect) {
                    feedbackBox.className = "p-4 rounded-xl border bg-emerald-950/40 border-emerald-600 text-emerald-300 text-sm mb-6";
                    feedbackBox.innerHTML = `<strong>Chính xác!</strong> ${q.rationale}`;
                } else {
                    feedbackBox.className = "p-4 rounded-xl border bg-rose-950/40 border-rose-600 text-rose-300 text-sm mb-6";
                    feedbackBox.innerHTML = `<strong>Chưa chính xác.</strong> Đáp án đúng là: <strong>${String.fromCharCode(65 + q.correct)}</strong>. ${q.rationale}`;
                }
            } else {
                feedbackBox.classList.add('hidden');
            }

            document.getElementById('prev-btn').disabled = currentIndex === 0;
            document.getElementById('next-btn').innerText = currentIndex === questions.length - 1 ? "Hoàn thành" : "Câu tiếp theo";
        }

        function selectAnswer(optionIndex) {
            if (userAnswers[currentIndex] !== null) return;

            userAnswers[currentIndex] = optionIndex;
            const q = questions[currentIndex];
            
            if (optionIndex === q.correct) {
                score++;
            }

            updateProgress();
            renderQuestion();
            renderGrid();
        }

        function nextQuestion() {
            if (currentIndex < questions.length - 1) {
                currentIndex++;
                renderQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            const wrongQuestions = questions
                .map((question, index) => ({ question, index }))
                .filter(({ question, index }) => userAnswers[index] !== null && userAnswers[index] !== question.correct);
            const unansweredCount = userAnswers.filter(answer => answer === null).length;

            document.getElementById('question-panel').classList.add('hidden');
            document.getElementById('navigation-controls').classList.add('hidden');
            document.getElementById('results-panel').classList.remove('hidden');
            document.getElementById('results-score').innerText = `Số câu đúng: ${score} / ${questions.length}`;
            document.getElementById('results-unanswered').innerText = unansweredCount
                ? `Bạn chưa trả lời ${unansweredCount} câu.`
                : 'Bạn đã trả lời tất cả câu hỏi.';

            const review = document.getElementById('wrong-review');
            const noWrongAnswers = document.getElementById('no-wrong-answers');
            const reviewButton = document.getElementById('review-wrong-btn');
            review.innerHTML = '';
            wrongReviewVisible = false;
            review.classList.add('hidden');
            noWrongAnswers.classList.add('hidden');
            reviewButton.disabled = wrongQuestions.length === 0;
            reviewButton.classList.toggle('opacity-50', wrongQuestions.length === 0);

            if (wrongQuestions.length === 0) {
                noWrongAnswers.innerText = 'Không có câu trả lời sai để xem lại.';
                noWrongAnswers.classList.remove('hidden');
                reviewButton.innerText = 'Không có câu sai';
                return;
            }

            reviewButton.innerText = `Xem lại câu sai (${wrongQuestions.length})`;
            wrongQuestions.forEach(({ question, index }) => {
                const card = document.createElement('article');
                card.className = 'rounded-xl border border-rose-700/60 bg-slate-900/50 p-4';

                const title = document.createElement('h3');
                title.className = 'font-semibold text-slate-100 mb-2';
                title.innerText = `Câu ${index + 1}: ${question.question}`;

                const chosenAnswer = document.createElement('p');
                chosenAnswer.className = 'text-rose-300 text-sm mb-1';
                chosenAnswer.innerText = `Bạn chọn: ${String.fromCharCode(65 + userAnswers[index])}. ${question.options[userAnswers[index]]}`;

                const correctAnswer = document.createElement('p');
                correctAnswer.className = 'text-emerald-300 text-sm mb-2';
                correctAnswer.innerText = `Đáp án đúng: ${String.fromCharCode(65 + question.correct)}. ${question.options[question.correct]}`;

                const rationale = document.createElement('p');
                rationale.className = 'text-slate-300 text-sm mb-3';
                rationale.innerText = question.rationale;

                const openButton = document.createElement('button');
                openButton.className = 'text-sm text-indigo-300 hover:text-indigo-200 underline';
                openButton.innerText = 'Mở câu hỏi';
                openButton.onclick = () => {
                    currentIndex = index;
                    document.getElementById('results-panel').classList.add('hidden');
                    document.getElementById('question-panel').classList.remove('hidden');
                    document.getElementById('navigation-controls').classList.remove('hidden');
                    renderQuestion();
                    updateProgress();
                };

                card.append(title, chosenAnswer, correctAnswer, rationale, openButton);
                review.appendChild(card);
            });
        }

        function toggleWrongReview() {
            wrongReviewVisible = !wrongReviewVisible;
            document.getElementById('wrong-review').classList.toggle('hidden', !wrongReviewVisible);
            document.getElementById('review-wrong-btn').setAttribute('aria-expanded', String(wrongReviewVisible));
        }

        function restartQuiz() {
            currentIndex = 0;
            userAnswers = new Array(questions.length).fill(null);
            score = 0;
            wrongReviewVisible = false;
            document.getElementById('results-panel').classList.add('hidden');
            document.getElementById('question-panel').classList.remove('hidden');
            document.getElementById('navigation-controls').classList.remove('hidden');
            renderQuestion();
            renderGrid();
            updateProgress();
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                renderQuestion();
            }
        }

        function goToQuestion(index) {
            currentIndex = index;
            renderQuestion();
            toggleGrid();
        }

        function updateProgress() {
            document.getElementById('progress-text').innerText = `${currentIndex + 1} / ${questions.length}`;
            document.getElementById('score-text').innerText = score;
        }

        function renderGrid() {
            const grid = document.getElementById('question-grid');
            grid.innerHTML = '';
            questions.forEach((q, idx) => {
                const btn = document.createElement('button');
                let statusClass = "bg-slate-700 text-slate-300 border-slate-600 hover:bg-slate-600";
                
                if (userAnswers[idx] !== null) {
                    if (userAnswers[idx] === q.correct) {
                        statusClass = "bg-emerald-900/60 text-emerald-200 border-emerald-600";
                    } else {
                        statusClass = "bg-rose-900/60 text-rose-200 border-rose-600";
                    }
                }
                if (idx === currentIndex) {
                    statusClass += " ring-2 ring-indigo-400";
                }

                btn.className = `h-10 rounded-xl border text-sm font-semibold flex items-center justify-center transition ${statusClass}`;
                btn.innerText = idx + 1;
                btn.onclick = () => goToQuestion(idx);
                grid.appendChild(btn);
            });
        }

        function toggleGrid() {
            const modal = document.getElementById('grid-modal');
            modal.classList.toggle('hidden');
            modal.classList.toggle('flex');
        }

        window.onload = initApp;
    </script>
