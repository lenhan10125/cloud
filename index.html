<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORICIIN — Giải pháp lưu trữ tệp thông tin nguồn mở</title>
    <meta name="description" content="oriciin.cloud là giải pháp nguồn mở giúp lưu trữ, quản lý và chia sẻ tệp thông tin trực tuyến.">
    <meta property="og:title" content="ORICIIN — Giải pháp lưu trữ tệp thông tin nguồn mở">
    <meta property="og:description" content="Giải pháp nguồn mở giúp lưu trữ, quản lý và chia sẻ tệp thông tin trực tuyến tại oriciin.cloud.">
    <meta property="og:url" content="https://oriciin.cloud/">
    <meta property="og:type" content="website">
    <script src="access.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        #dot-background {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }
        .container {
            position: relative;
            z-index: 1;
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        .error-message {
            color: #d9534f;
            font-weight: bold;
        }
        .cache-info {
            margin-top: 24px;
            padding-top: 18px;
            border-top: 1px solid #e5e5e5;
            color: #555;
            font-size: 14px;
        }
        .cache-info strong {
            color: #222;
        }
        #refresh-cache {
            margin-top: 10px;
            padding: 8px 14px;
            border: 0;
            border-radius: 4px;
            background: #337ab7;
            color: #fff;
            cursor: pointer;
        }
        #clear-cache {
            margin: 10px 0 0 6px;
            padding: 8px 14px;
            border: 0;
            border-radius: 4px;
            background: #d9534f;
            color: #fff;
            cursor: pointer;
        }
    </style>
</head>
<body id="index">
    <canvas id="dot-background" aria-hidden="true"></canvas>
    <div class="container">
        <noscript>
            <div class="error-message">
                <h2>Cần bật JavaScript</h2>
                <p>Trang này cần JavaScript để hoạt động. Vui lòng bật JavaScript trong trình duyệt rồi tải lại trang.</p>
            </div>
        </noscript>

        <div id="js-content">
            <div class="error-message" role="status">
                <h2>Trang này yêu cầu JavaScript</h2>
                <p>Vui lòng bật JavaScript trong trình duyệt để tiếp tục.</p>
            </div>
            <p id="redirect-status" aria-live="polite">Đang kiểm tra quyền truy cập, vui lòng đợi 1 giây.</p>
            <div class="cache-info" aria-live="polite">
                <strong>Dung lượng cache</strong>
                <p id="cache-size">Đang kiểm tra...</p>
                <button id="refresh-cache" type="button">Cập nhật</button>
                <button id="clear-cache" type="button">Xóa cache cũ</button>
            </div>
        </div>
    </div>
    <script id="java-data-function" src="/store/java/java_data_function.js"></script>
</body>
</html>
